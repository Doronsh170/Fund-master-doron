<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>חיפוש קרנות</title>
<style>
:root {
  --bg:#f6f3ee; --panel:#fffdf9; --text:#171717; --muted:#6f6a63;
  --line:#ddd6cd; --accent:#6f1538; --accent2:#8e214a; --soft:#efe8e1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
header{margin-bottom:18px}
h1{margin:0 0 6px;font-size:30px;font-weight:750}
.sub{color:var(--muted);font-size:14px}
.searchbox{background:var(--panel);border:1px solid var(--line);padding:16px;margin:18px 0}
.searchrow{display:grid;grid-template-columns:1fr auto;gap:10px}
input[type=text]{width:100%;font-size:22px;padding:15px 16px;border:1px solid #bfb7ae;background:white;outline:none}
input[type=text]:focus{border-color:var(--accent)}
.clear{border:1px solid var(--line);background:#fff;padding:0 18px;font-size:15px;cursor:pointer}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
select{padding:10px 12px;border:1px solid var(--line);background:white;font-size:14px}
.stats{display:flex;justify-content:space-between;align-items:center;margin:14px 0;color:var(--muted);font-size:14px}
.results{display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px 16px}
.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.name{font-size:18px;font-weight:700;line-height:1.35}
.num{white-space:nowrap;color:var(--muted);font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{background:var(--soft);padding:5px 8px;font-size:12px}
.rating{font-weight:700;color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line)}
mark{background:#f1dbe4;color:inherit;padding:0}
footer{margin:22px 0 8px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:700px){
  .wrap{padding:14px}
  h1{font-size:25px}
  .searchrow{grid-template-columns:1fr}
  .clear{height:44px}
  .top{display:block}
  .num{margin-top:5px}
}
</style>
<link rel="stylesheet" href="personal-tabs.css"></head>
<body>
<div class="wrap">
<header>
  <h1>חיפוש קרנות</h1>
  <div class="sub">מבוסס על מאגר הקרנות מהאקסל, 206 קרנות וקרנות סל.</div>
</header>

<section class="searchbox">
  <div class="searchrow">
    <input aria-label="חיפוש מיידי בכל הקרנות" id="q" type="text" placeholder="מילה, אפיק או מספר קרן: דולר, לפדיון, 90/10, מח״מ 10..." autofocus>
    <button class="clear" id="clearBtn">נקה</button>
  </div>
  <div class="filters">
    <select id="typeFilter">
      <option value="">כל סוגי הקרנות</option>
      <option>קרן נאמנות</option>
      <option>קרן מחקה</option>
      <option>קרן סל</option>
    </select>
    <select id="fxFilter">
      <option value="">כל חשיפות המט״ח</option>
      <option>כן</option>
      <option>מנוטרלת מט״ח</option>
      <option>לא ידוע</option>
    </select>
    <select id="denomFilter">
      <option value="">כל סוגי הנקיבה</option>
      <option value="כן">נקובה במט״ח</option>
      <option value="לא">לא נקובה במט״ח</option>
    </select>
  </div>
</section>

<div class="stats">
  <div id="count"></div>
  <div id="hint">חיפוש מיידי בשם, במסלול, בחברה ובהערות</div>
</div>

<div id="results" class="results"></div>

<footer>הנתונים מבוססים על החומרים שהוזנו למאגר. יש לבדוק תשקיף ודיווחים עדכניים לפני שימוש מקצועי.</footer>
</div>

const q = document.getElementById('q');
const typeFilter = document.getElementById('typeFilter');
const fxFilter = document.getElementById('fxFilter');
const denomFilter = document.getElementById('denomFilter');
const results = document.getElementById('results');
const count = document.getElementById('count');
const clearBtn = document.getElementById('clearBtn');

function norm(v) {
  return String(v ?? '').toLowerCase().replace(/["'׳״]/g,'').replace(/\s+/g,' ').trim();
}
function searchable(r) {
  return norm([
    r["סוג קרן"], r["חשיפה למט״ח"], r["נקובה במט״ח"], r["מסלול השקעה"],
    r["שם הקרן"], r["מספר קרן"], r["חברה מנהלת"], r["דירוג דיסקונט"],
    r["דמי ניהול"], r["הערות"]
  ].join(' '));
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function highlight(text, term) {
  const safe = esc(text);
  if (!term) return safe;
  const t = esc(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try { return safe.replace(new RegExp(t,'gi'), m => `<mark>${m}</mark>`); }
  catch(e) { return safe; }
}
function render() {
  const term = norm(q.value);
  const tf = typeFilter.value;
  const ff = fxFilter.value;
  const df = denomFilter.value;

  const filtered = DATA.filter(r => {
    if (tf && r["סוג קרן"] !== tf) return false;
    if (ff && r["חשיפה למט״ח"] !== ff) return false;
    if (df && r["נקובה במט״ח"] !== df) return false;
    if (!term) return true;
    return FundSearch.match(r, term).matched;
  });

  if (term) filtered.sort((a,b) => FundSearch.match(b,term).score - FundSearch.match(a,term).score);
  count.textContent = `${filtered.length} תוצאות מתוך ${DATA.length} קרנות`;

  if (!filtered.length) {
    results.innerHTML = '<div class="empty">לא נמצאו קרנות מתאימות.</div>';
    return;
  }

  results.innerHTML = filtered.map(r => `
    <article class="card">
      <div class="top">
        <div class="name">${highlight(r["שם הקרן"], term)}</div>
        <div class="num">מס׳ קרן: ${highlight(r["מספר קרן"], term)}</div>
      </div>
      <div class="meta">
        ${term ? `<span class="fund-search-evidence">${esc(FundSearch.match(r, term).reason)}</span>` : ''}
        <span class="tag">${esc(r["סוג קרן"])}</span>
        <span class="tag">${highlight(r["מסלול השקעה"], term)}</span>
        <span class="tag">${highlight(r["חברה מנהלת"], term)}</span>
        <span class="tag">מט״ח: ${esc(r["חשיפה למט״ח"])}</span>
        <span class="tag">נקובה במט״ח: ${esc(r["נקובה במט״ח"])}</span>
        ${r["דמי ניהול"] ? `<span class="tag">דמי ניהול: ${esc(r["דמי ניהול"])}</span>` : ''}
        ${r["דירוג דיסקונט"] !== '' ? `<span class="tag rating">דירוג דיסקונט: ${esc(r["דירוג דיסקונט"])}</span>` : ''}
      </div>
    </article>
  `).join('');
}

[q,typeFilter,fxFilter,denomFilter].forEach(el => el.addEventListener('input', render));
clearBtn.addEventListener('click', () => {
  q.value=''; typeFilter.value=''; fxFilter.value=''; denomFilter.value=''; q.focus(); render();
});
render();
