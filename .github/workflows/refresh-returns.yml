name: Refresh official MAYA fund returns
on:
  schedule:
    # 21:00 Israel: 18:00 UTC (summer) or 19:00 UTC (winter)
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'refresh-request.txt'
concurrency:
  group: official-maya-fund-refresh
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  schedule_guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Match scheduled UTC slot to 21:00 in Israel
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime as dt, os
          from zoneinfo import ZoneInfo
          event = os.environ["EVENT_NAME"]
          if event != "schedule":
              allowed = True
          else:
              utc_hour = int(os.environ["SCHEDULE"].split()[1])
              today_utc = dt.datetime.now(dt.timezone.utc).date()
              slot = dt.datetime.combine(today_utc, dt.time(utc_hour), tzinfo=dt.timezone.utc)
              local = slot.astimezone(ZoneInfo("Asia/Jerusalem"))
              allowed = local.hour == 21
              print("Scheduled UTC slot:", slot.isoformat(), "Israel:", local.isoformat(), "run:", allowed)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("should_run=" + ("true" if allowed else "false") + "\n")
          PY
  refresh:
    needs: schedule_guard
    if: needs.schedule_guard.outputs.should_run == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact source verification guards
        run: node tests/validate-maya-source.test.cjs
      - name: Check refresh and catalog generator syntax
        run: |
          node --check scripts/refresh-maya-performance.cjs
          node --check scripts/write-maya-performance.cjs
      - name: Fetch exact official MAYA yields
        # Reject rounding, swapped periods, stale fallbacks and source mismatches.
        run: node scripts/refresh-maya-performance.cjs
      - name: Validate returned data
        run: node tests/maya-performance-data.test.cjs
      - name: Verify MAYA-only search catalog and fees
        run: node tests/maya-catalog-data.test.cjs
      - name: Version performance scripts to prevent stale mobile caches
        run: |
          python - <<'PY'
          import pathlib,re
          p=pathlib.Path("index.html")
          s=p.read_text(encoding="utf-8")
          stamp=__import__("datetime").datetime.now(__import__("datetime").timezone.utc).strftime("%Y%m%d%H%M%S")
          s,n=re.subn(r'src="(maya-performance/part-\d{2}\.js|maya-performance-data\.js|maya-catalog-data\.js)(?:\?v=[^"]*)?"',lambda m:'src="'+m.group(1)+'?v='+stamp+'"',s)
          if n!=18:raise RuntimeError(f"Expected 18 MAYA script references, found {n}")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit verified official figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maya-performance/ maya-performance-data.js maya-catalog-data.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh exact official MAYA reported returns"
            # Preserve unrelated edits; conflicting edits fail safely.
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            node tests/maya-performance-data.test.cjs
            git push
          fi
      - name: Revalidate snapshot after integrating concurrent edits
        run: node tests/maya-performance-data.test.cjs
      - name: Revalidate official MAYA fund catalog
        run: node tests/maya-catalog-data.test.cjs
      - name: Publish verified site
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-maya-pages.cjs
      - name: Verify published data and cache versions
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published-maya.cjs
