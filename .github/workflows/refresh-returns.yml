name: Refresh MAYA fund returns
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-returns.yml'
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Refresh and validate returns
        run: python scripts/refresh_returns.py --max-age 5 --min-coverage 0.75
      - name: Commit validated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maya-performance/ maya-performance-data.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified MAYA fund returns"
            git push
          fi
