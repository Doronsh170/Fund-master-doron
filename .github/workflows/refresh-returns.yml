name: Refresh official MAYA fund returns
on:
  schedule:
    - cron: '0 21 * * 1-5'
      timezone: Asia/Jerusalem
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'refresh-request.txt'
concurrency:
  group: official-maya-fund-refresh
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact official MAYA yields
        run: node scripts/refresh-maya-performance.cjs
      - name: Validate returned data
        run: node tests/maya-performance-data.test.cjs
      - name: Version performance scripts to prevent stale mobile caches
        run: |
          python - <<'PY'
          import pathlib,re
          p=pathlib.Path("index.html")
          s=p.read_text(encoding="utf-8")
          stamp=__import__("datetime").datetime.now(__import__("datetime").timezone.utc).strftime("%Y%m%d%H%M%S")
          s,n=re.subn(r'src="(maya-performance/part-\d{2}\.js|maya-performance-data\.js)(?:\?v=[^"]*)?"',lambda m:'src="'+m.group(1)+'?v='+stamp+'"',s)
          if n!=17:raise RuntimeError(f"Expected 17 performance script references, found {n}")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit verified official figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maya-performance/ maya-performance-data.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh exact official MAYA reported returns"
            # Preserve unrelated edits; conflicting edits fail safely.
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            node tests/maya-performance-data.test.cjs
            git push
          fi
      - name: Revalidate snapshot after integrating concurrent edits
        run: node tests/maya-performance-data.test.cjs
      # Explicit deployment also works for commits made with GITHUB_TOKEN.
      - name: Prepare published snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/maya-site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/maya-site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/maya-site
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published data and cache versions
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published-maya.cjs
