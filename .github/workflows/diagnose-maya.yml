name: Diagnose official MAYA fund API
on:
  workflow_dispatch:
concurrency:
  group: official-maya-fund-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture official yields for one fund without changing published data
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          (async () => {
            const response = await fetch('https://maya.tase.co.il/api/v1/funds/mutual/5100144', {signal: AbortSignal.timeout(30000)});
            if (!response.ok) throw Error('MAYA HTTP ' + response.status);
            const data = await response.json();
            if (String(data.fundId) !== '5100144' || !data.yields) throw Error('Unexpected official MAYA schema');
            fs.writeFileSync('maya-api-diagnostic.json', JSON.stringify(data, null, 2));
            console.log(JSON.stringify({fundId: data.fundId, yields: data.yields}, null, 2));
          })().catch(error => {console.error(error); process.exitCode = 1;});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: maya-api-diagnostic
          path: maya-api-diagnostic.json
