name: Diagnose MAYA fund API
on:
  push:
    paths:
      - 'scripts/refresh_returns.py'
      - '.github/workflows/diagnose-maya.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Inspect one fund response
        run: python scripts/refresh_returns.py --max-age 5 --min-coverage 0.90
