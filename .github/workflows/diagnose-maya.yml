name: Diagnose MAYA fund API
on:
  push:
    paths:
      - 'scripts/refresh_returns.py'
      - '.github/workflows/diagnose-maya.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Capture one-fund API schema
        run: python scripts/refresh_returns.py --probe-only
      - name: Probe NAV history coverage
        run: |
          python - <<'PY'
          import requests,json,csv,io
          u="https://maya.tase.co.il/api/v1/funds/mutual/5100144/history/file"
          out=[]
          for period in [0,1,2,3,4,5,6,12]:
            p={"pageSize":600,"pageNumber":1,"period":period,"fromDate":"2025-09-01T00:00:00.000Z","toDate":"2026-10-29T00:00:00.000Z"}
            try:
              r=requests.post(u,json=p,headers={"Origin":"https://maya.tase.co.il","Referer":"https://maya.tase.co.il/","Accept":"text/csv","User-Agent":"Mozilla/5.0"},timeout=30)
              rows=list(csv.reader(io.StringIO(r.content.decode("utf-8-sig"))))
              out.append({"period":period,"status":r.status_code,"rowCount":len(rows)-1,"first":rows[1][:2] if len(rows)>1 else None,"last":rows[-1][:2] if len(rows)>1 else None})
            except Exception as e:out.append({"period":period,"error":str(e)})
          open("maya-nav-probe.json","w").write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Save diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maya-api-diagnostic.json maya-nav-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record MAYA API response schema"
            git push
          fi
