name: Diagnose MAYA fund API
on:
  push:
    paths:
      - 'scripts/refresh_returns.py'
      - '.github/workflows/diagnose-maya.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Capture one-fund API schema
        run: python scripts/refresh_returns.py --probe-only
      - name: Save diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maya-api-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "Record MAYA API response schema"
            git push
          fi
