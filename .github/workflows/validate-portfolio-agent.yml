name: Validate portfolio construction agent
on:
  push:
    paths:
      - 'portfolio-agent.html'
      - 'portfolio-passive-ids.js'
      - '.github/workflows/validate-portfolio-agent.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and required safeguards
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('portfolio-agent.html','utf8');
          const js=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          assert(js,'Missing script');
          new vm.Script(js,{filename:'portfolio-agent.html'});
          for(const token of ['exposure','buildPortfolio','riskLevels','requested,allowed','score!==null','sourceVerified','c.eq','c.fx','מגבלות','function managementStyle','managementStyle(f)===c.advisor.style']){
            assert(js.includes(token),'Missing required guard: '+token);
          }
          // Verify fund-number mapping against the uploaded TASE workbook totals.
          const mapSrc=fs.readFileSync('portfolio-passive-ids.js','utf8');
          const ctx={window:{},performance:{}};
          vm.createContext(ctx);
          vm.runInContext(mapSrc,ctx);
          const passive=ctx.window.FUND_PASSIVE_IDS,active=ctx.window.FUND_ACTIVE_IDS;
          assert.equal(passive.size,849);
          assert.equal(active.size,1168);
          assert.equal([...passive].reduce((a,x)=>a+Number(x),0),4357426340);
          assert.equal([...active].reduce((a,x)=>a+Number(x),0),5977577411);
          assert.equal([...passive].reduce((a,x,i)=>a+Number(x)*(i+1),0),1853595033335);
          assert.equal([...active].reduce((a,x,i)=>a+Number(x)*(i+1),0),3503716363308);
          assert([...passive].every(x=>!active.has(x)),'Fund classified both passive and active');
          const method=js.match(/function managementStyle\(f\)\{[\s\S]*?\n\}\nfunction advisor/);
          assert(method,'Missing management style classifier');
          const source=method[0].replace(/\nfunction advisor$/,'');
          vm.runInContext(source+';this.classify=managementStyle',ctx);
          assert.equal(ctx.classify({number:'5101506'}),'passive','Tracking mutual must be passive');
          assert.equal(ctx.classify({number:'5106562'}),'active','Actively managed fund must be active');
          assert.equal(ctx.classify({number:'9999999'}),'unknown','Unmapped mutual must not be guessed');
          ctx.performance['9999999']={sourceApi:'https://maya.tase.co.il/api/v1/funds/etf/9999999',sourceSnapshot:{metadata:{fundType:'קרן סל'}}};
          assert.equal(ctx.classify({number:'9999999'}),'passive','Verified exchange-traded fund must be passive');
          assert(js.includes('portfolio-passive-ids.js?v='),'Reference file must be loaded by portfolio agent');
          const link=fs.readFileSync('index.html','utf8');
          assert(link.includes('portfolio-agent.html'),'Builder link missing in index');
          console.log('Portfolio agent syntax, constraints and navigation validated.');
          NODE
