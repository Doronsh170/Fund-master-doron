name: Probe official MAYA fund listing endpoints
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-maya-list.cjs'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose official fund-list access without changing published data
        run: node scripts/probe-maya-list.cjs
