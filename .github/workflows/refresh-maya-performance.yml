name: רענון חודשי של ביצועי מאיה

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: maya-performance-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: שליפת נתונים לכל הקרנות
        run: node scripts/refresh-maya-performance.cjs
      - name: בדיקת שלמות הנתונים
        run: node tests/maya-performance-data.test.cjs
      - name: יצירת בקשת משיכה לעדכון הנתונים בלבד
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add maya-performance-data.js maya-performance/
          if git diff --cached --quiet; then
            echo 'לא חל שינוי בקובץ הנתונים.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="data/maya-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh dated MAYA performance data'
          git push origin "$branch"
          node -e "const d=require('./maya-performance-data.js'); console.log('עדכון נתוני הביצועים ממאיה.\n\n'+JSON.stringify(d.report,null,2)+'\n\nהעדכון ממתין לבדיקה. אין מיזוג אוטומטי.');" > /tmp/maya-refresh-body.txt
          if ! gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title 'עדכון חודשי של נתוני ביצועים ממאיה' --body-file /tmp/maya-refresh-body.txt; then
            echo 'הנתונים נשמרו בענף נפרד. יש לאפשר יצירת בקשות משיכה באמצעות GitHub Actions בהגדרות המאגר, או לפתוח בקשה מהענף:' >> "$GITHUB_STEP_SUMMARY"
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${branch}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'נוצרה בקשת משיכה לעדכון נתונים. האתר הפעיל לא השתנה.' >> "$GITHUB_STEP_SUMMARY"